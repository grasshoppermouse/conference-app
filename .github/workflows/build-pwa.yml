name: Build PWA

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Indico / Conference Event ID'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run HBES Export Script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          EVENT_ID: ${{ inputs.event_id }}
        run: |
          # Passes EVENT_ID both as an environment variable and as a CLI argument (--event-id)
          python hbes-export.py --event-id "${{ inputs.event_id }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pwa-build-output
          path: |
            docs/
            *.html
            *.json
            *.js
            *.css
            *.svg
      - name: Commit and push updated PWA files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ *.html *.json *.js *.css *.svg
          git commit -m "auto: rebuild PWA for event ${{ inputs.event_id }}" || echo "No changes to commit"
          git push