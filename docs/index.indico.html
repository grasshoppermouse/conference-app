    <script>
        // Platform detection and share icon setup
        const isAppleDevice = /Mac|iPhone|iPad|iPod/.test(navigator.userAgent);
        const shareIconSrc = isAppleDevice ? "./box-arrow-up.svg" : "./share.svg";

        // Global State & Data Deserialization
        let favorites = JSON.parse(localStorage.getItem("conference_favorites") || "{}") || {};
        let talkIndex = {"1": {"id": "1", "session_id": 30595, "title": "Depression is not a disoder", "primaryauthors": [{"first_name": "Edward", "last_name": "Hagen", "affiliation": "Washington State University", "person_id": 271751, "email": "edhagen@wsu.edu", "presentations": ["1", "2"]}], "coauthors": [{"first_name": "Michael", "last_name": "Gaffney", "affiliation": "UCLA", "person_id": 271816, "email": "michael.gaffney@wsu.edu", "presentations": ["1"]}], "abstract": "<p class = \"title\"><strong>Depression is not a disoder</strong></p>\n    <div class=\"authors-block\">\n  <p class=\"authors\">Edward Hagen<sup>1</sup>, Michael Gaffney<sup>2</sup></p>\n<ol class=\"affiliations\">\n  <li>Washington State University</li>\n  <li>UCLA</li>\n</ol>\n</div>\n    <div class = \"abstract\" style = \"margin-top: 10px;\">\n    <p>Major <strong>depression</strong> is considered to be a pathological response to stress that elicits aversive responses towards depressed individuals. Alternatively, depression might involve honest signals of need in response to stress and help to bargain for increased support from reluctant others. To test this hypothesis, we examined responses to a wide range of emotional signals in a vignette study in which we also manipulated information about the signaler\u2019s need and her levels of conflict with the social partner (participant) in a between-subjects factorial design. Specifically, a fictional sister asked the participant to help pay for medical treatment. The sister\u2019s true need for money was either clear or questionable, and her level of conflict with the participant was either high or low. The sister\u2019s signals were either verbal request, crying, depression, or, as a control, schizophrenic symptoms.</p>\n<p>In our sample of 1,447 participants recruited from Amazon Mechanical Turk, depression increased belief in need and elicited more help than all the other proposed signals of need on our four outcome measures across all conditions. Simple crying and verbal requests were generally less effective. We also found evidence for the predicted interaction between signal type and conflict on relationship outcomes. Because signals comprising symptoms of schizophrenia caused a dramatic reduction in support, we can discount the hypothesis that help was provided due to symptoms of mental illness. Our results suggest that depression, an apparent human universal, is a relatively successful way of signaling honest need and eliciting support, consistent with costly signaling explanations.</p>\n    </div>\n    ", "location": "VMMC", "type": "Podium", "startdatetime": "2027-05-12 09:00:00-07:00", "start_time": "09:00 AM", "day": "Wed", "email": "edhagen@wsu.edu"}, "2": {"id": "2", "session_id": 30628, "title": "Ethnicity, fertility, and tobacco use: a biocultural test of the fetal protection model of female smoking", "primaryauthors": [{"first_name": "Tiffany", "last_name": "Alvarez", "affiliation": "UC Santa Barbara", "person_id": 272106, "email": "tiffany.alvarez@wsu.edu", "presentations": ["2"]}], "coauthors": [{"first_name": "Edward", "last_name": "Hagen", "affiliation": "Washington State University", "person_id": 271751, "email": "edhagen@wsu.edu"}], "abstract": "<p class = \"title\"><strong>Ethnicity, fertility, and tobacco use: a biocultural test of the fetal protection model of female smoking</strong></p>\n    <div class=\"authors-block\">\n  <p class=\"authors\">Tiffany Alvarez<sup>1</sup>, Edward Hagen<sup>2</sup></p>\n<ol class=\"affiliations\">\n  <li>UC Santa Barbara</li>\n  <li>Washington State University</li>\n</ol>\n</div>\n    <div class = \"abstract\" style = \"margin-top: 10px;\">\n    <p>Currently, cross-country variation in gender equality is thought to be the primary factor producing global tobacco use sex differences, with gender inequality, especially in low-to-middle-income countries, preventing women from obtaining and using tobacco. Our alternative hypothesis draws on the \u201cfetal protection\u201d theory from evolutionary anthropology which emphasizes that reproductively-aged women protect their fetuses and nursing infants via an evolved a network of toxin defenses, characterized by upregulated detoxification of- and/or strong aversions to- teratogenic substances (e.g. tobacco)\u2014individual-level defenses that are furthermore reinforced by culture-level proscriptions aimed at safeguarding fetal/offspring health. Although support for the fetal protection model has been found (Hagen et al. 2016), prior research has used data aggregated at the nation-level and has neither examined individual-level variation nor considered that cultural norms may also influence tobacco use. Using individual-level data from a high fertility, tobacco-growing, ethnically and socioeconomically diverse province in the South Central Andes (Jujuy, Argentina), we explore the relationship various fertility indices and sociocultural tobacco norms have on nulliparous and multiparous women\u2019s tobacco use outcomes (N=108), while controlling for demographic features and considering ethnic differences as main effects. Smoker status was determined via salivary cotinine and cross-validated with questionnaire data. Our analyses reveal ethnic differences in tobacco use attitudes and behaviors and suggest fertility characteristics are important factors in female smoking decisions. Consistent with fetal protection model predictions, these findings suggest smoking vulnerabilities intersect with sex and socio-cultural variables in an additive manner and open the door to future areas of research.</p>\n    </div>\n    ", "location": "", "type": "Podium", "startdatetime": "2027-05-13 08:00:00-07:00", "start_time": "08:00 AM", "day": "Thu", "email": "tiffany.alvarez@wsu.edu"}};
        let authorIndex = {"272106": {"first_name": "Tiffany", "last_name": "Alvarez", "affiliation": "UC Santa Barbara", "person_id": 272106, "email": "tiffany.alvarez@wsu.edu", "presentations": ["2"]}, "271816": {"first_name": "Michael", "last_name": "Gaffney", "affiliation": "UCLA", "person_id": 271816, "email": "michael.gaffney@wsu.edu", "presentations": ["1"]}, "271751": {"first_name": "Edward", "last_name": "Hagen", "affiliation": "Washington State University", "person_id": 271751, "email": "edhagen@wsu.edu", "presentations": ["1", "2"]}};

        function updatePlatformIcons() {
            document.querySelectorAll(".share-icon").forEach((img) => {
                img.src = shareIconSrc;
            });
        }

        function convertAbstractToPlainText(htmlString) {
            if (!htmlString) return "";
            const doc = new DOMParser().parseFromString(htmlString, 'text/html');
            doc.querySelectorAll('p, div, br').forEach((el) => {
                if (el.tagName.toLowerCase() === 'br') {
                    el.replaceWith('\n');
                } else {
                    el.appendChild(doc.createTextNode('\n'));
                }
            });
            return doc.body.textContent
                .split('\n')
                .map((line) => line.trim())
                .filter((line) => line.length > 0)
                .join('\n');
        }

            const authorsPane = document.getElementById("pills-authors");
            if (authorsPane) authorsPane.classList.add("show", "active");

            if (searchInput) searchInput.placeholder = "Search authors...";
            renderAuthorsSkeleton();

        function renderFavoritesList() {
            const listContainer = document.getElementById("favorites-list");
            if (!listContainer) return;

            favorites = JSON.parse(localStorage.getItem("conference_favorites") || "{}") || {};
            const keys = Object.keys(favorites);

            if (keys.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-4 text-muted"><p class="mb-0">No favorites saved yet.</p><small>Tap the star icon on any talk or session to save it here.</small></div>';
                return;
            }

            let favItems = keys.map((key) => ({
                key: key,
                data: favorites[key] || {},
            }));

            favItems.sort((a, b) => {
                const timeA = a.data.time ? new Date(a.data.time).getTime() : 0;
                const timeB = b.data.time ? new Date(b.data.time).getTime() : 0;
                return timeA - timeB;
            });

            listContainer.innerHTML = "";

            favItems.forEach((item) => {
                const [type, id] = item.key.split(":");
                const data = item.data;
                const isFav = !!favorites[`${type}:${id}`];
                const starImg = isFav ? "./star-fill.svg" : "./star.svg";

                const cardElement = document.createElement("div");
                cardElement.className = "card rounded-0 mb-2 shadow-sm";

                let content = "";
                let formattedTime = "";

                if (data.time) {
                    const dateObj = new Date(data.time);
                    if (!isNaN(dateObj.getTime())) {
                        formattedTime =
                            dateObj.toLocaleDateString("en-US", {
                                weekday: "short",
                                month: "short",
                                day: "numeric",
                            }) +
                            " " +
                            dateObj.toLocaleTimeString("en-US", {
                                hour: "2-digit",
                                minute: "2-digit",
                            });
                    } else {
                        formattedTime = data.time;
                    }
                }

                let modalAttributes = type === "talk" ? `role="button" tabindex="0" data-bs-toggle="modal" data-bs-target="#globalTalkModal" data-id="${id}"` : "";

                content += `<div class="flex-grow-1 text-start" ${modalAttributes}>`;
                content += `  <h6 class="${type === "talk" ? "mb-1 text-primary fw-bold" : "mb-1 text-success fw-bold"}">${data.title || 'Untitled'}</h6>`;

                if (formattedTime) {
                    content += `  <p class="mb-0 small text-muted"><img src="./calendar.svg" alt="Calendar" style="width: 14px; margin-right: 4px;" /> ${formattedTime}</p>`;
                }
                if (data.location) {
                    content += `  <p class="mb-0 small text-muted"><img src="./geo-alt.svg" alt="Location" style="width: 14px; margin-right: 4px;" /> ${data.location}</p>`;
                }
                content += `</div>`;

                content += `<div>`;
                content += `  <button type="button" class="fav-btn btn btn-link p-0 ms-3"
                            data-type="${type}"
                            data-id="${id}"
                            data-time="${data.time || ""}"
                            data-location="${data.location || ""}"
                            data-title="${(data.title || "").replace(/"/g, '&quot;')}"
                            title="Favorite">
                            <img src="${starImg}" alt="Favorite" />
                          </button>`;
                content += `</div>`;

                const cardBody = document.createElement("div");
                cardBody.className = "card-body d-flex justify-content-between align-items-center p-3";

                cardBody.innerHTML = content;
                cardElement.appendChild(cardBody);
                listContainer.appendChild(cardElement);
            });
        }

                const type = btn.dataset.type;
                if (!id || !type) return;

                const key = `${type}:${id}`;

                let labelText = btn.dataset.title;
                if (!labelText && type === "talk" && talkIndex[id]) {
                    labelText = talkIndex[id].title;

                if (!labelText) {

                }
                if (!labelText) labelText = "Untitled Item";

                labelText = labelText.split("\n")[0];

                if (favorites[key]) {
                    delete favorites[key];
                } else {
                    favorites[key] = {
                        title: labelText,
                        time: btn.dataset.time || (talkIndex[id] ? talkIndex[id].startdatetime : ""),
                        location: btn.dataset.location || (talkIndex[id] ? talkIndex[id].location : ""),
                        timestamp: new Date().toISOString(),

            document.getElementById("btn-export-favorites")?.addEventListener("click", async () => {
                const storedFavs = JSON.parse(localStorage.getItem("conference_favorites") || "{}") || {};
                const keys = Object.keys(storedFavs);
                const talkKeys = keys.filter((key) => key.startsWith("talk:"));

                if (talkKeys.length === 0) {
                    alert("You don't have any favorited talks to export yet!");
                    return;
                }

                let compiledTalks = talkKeys.map((key) => {
                    const [_, id] = key.split(":");
                    const talkData = (talkIndex || {})[id];
                    const favItem = storedFavs[key] || {};

                    return {
                        time: talkData ? talkData.startdatetime : favItem.time || "",
                        metaTime: talkData ? `${talkData.day || ''}, ${talkData.start_time || ''}` : "",
                        location: talkData ? talkData.location : favItem.location || "",
                        formattedContent: talkData && talkData.abstract
                            ? convertAbstractToPlainText(talkData.abstract)
                            : `📌 ${favItem.title || 'Talk'}`
                    };
                });

                compiledTalks.sort((a, b) => new Date(a.time) - new Date(b.time));

                let exportText = "HBES 2027 - My Saved Talks & Abstracts\n";
                exportText += "========================================\n\n";

                compiledTalks.forEach((talk) => {
                    exportText += talk.formattedContent + "\n";
                    if (talk.metaTime) exportText += `⏰ SCHEDULED TIME: ${talk.metaTime}\n`;
                    if (talk.location) exportText += `📍 LOCATION: ${talk.location}\n`;

                if (navigator.share) {

        // Sync Hash Routing
        function handleRouting() {
            const hash = window.location.hash;
            if (!hash) return;

            const parts = hash.split('/');
            if (parts.length < 3) return;

            const routeType = parts[1];
            const id = parts[2];

            if (routeType === 'talk') {
                const globalModal = document.getElementById('globalTalkModal');
                if (globalModal) {
                    const originalBtn = document.querySelector(`button[data-id="${id}"][data-bs-target="#globalTalkModal"]`);
                    const modalInstance = bootstrap.Modal.getOrCreateInstance(globalModal);

                    if (originalBtn) {
                        modalInstance.show(originalBtn);
                    } else {
                        globalModal.dataset.activeTalkId = id;
                        modalInstance.show();
                    }
                }
            } else if (routeType === 'session') {
                showScheduleView();

                const element = document.querySelector(`.tab-content .tab-pane:not(#pills-authors) #collapse${id}`);
                if (element) {
                    const tabPane = element.closest('.tab-pane');
                    if (tabPane) {
                        const tabTrigger = document.querySelector(`button[data-bs-target="#${tabPane.id}"]`);
                        if (tabTrigger) bootstrap.Tab.getOrCreateInstance(tabTrigger).show();
                    }
                    bootstrap.Collapse.getOrCreateInstance(element).show();
                    setTimeout(() => {
                        element.closest('.accordion-item')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 300);
                }
            } else if (routeType === 'author') {
                showAuthorsView();

                const element = document.querySelector(`#accordion-authors #collapse${id}`);
                if (element) {
                    bootstrap.Collapse.getOrCreateInstance(element).show();
                    setTimeout(() => {
                        element.closest('.accordion-item')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 300);
                }
            }
        }

        window.addEventListener('hashchange', handleRouting);
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(handleRouting, 100);
        });

        document.body.addEventListener('show.bs.collapse', function (event) {
            const collapseEl = event.target;
            if (!collapseEl.id || !collapseEl.id.startsWith('collapse')) return;

            const id = collapseEl.id.replace('collapse', '');

            if (collapseEl.closest('#accordion-authors')) {
                if (window.location.hash !== `#/author/${id}`) window.location.hash = `#/author/${id}`;
            } else {
                if (window.location.hash !== `#/session/${id}`) window.location.hash = `#/session/${id}`;
            }

        document.body.addEventListener('hide.bs.collapse', function (event) {
            const collapseEl = event.target;
            if (!collapseEl.id || !collapseEl.id.startsWith('collapse')) return;

            const id = collapseEl.id.replace('collapse', '');
            if (window.location.hash === `#/session/${id}` || window.location.hash === `#/author/${id}`) {
                window.location.hash = '';
            }
        });

        document.getElementById('btn-scan-qr')?.addEventListener('click', () => {
            const qrModalEl = document.getElementById('qrScannerModal');

        document.getElementById('qrScannerModal')?.addEventListener('shown.bs.modal', () => {
            html5QrScanner = new Html5Qrcode("qr-video-reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrScanner.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    try {
                        const url = decodedText.includes('#') ? new URL(decodedText) : null;
                        const hashValue = url ? url.hash : decodedText;

                        if (hashValue && hashValue.startsWith('#/')) {
                            html5QrScanner.stop().then(() => {
                                const qrModalEl = document.getElementById('qrScannerModal');
                                if (qrModalEl) bootstrap.Modal.getInstance(qrModalEl)?.hide();
                                window.location.hash = hashValue;
                            });
                        }
                    } catch (err) {
                        console.error("Malformed QR data payload parsed.", err);
                    }
                },
                () => { }
            ).catch(err => console.error("Camera access failed or rejected by system settings.", err));
        });

        document.getElementById('qrScannerModal')?.addEventListener('hide.bs.modal', () => {

        async function copyToClipboardFallback(textToCopy, btn) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(textToCopy);
                } else {
                    const textarea = document.createElement("textarea");
                    textarea.value = textToCopy;
                    textarea.style.position = "fixed";
                    textarea.style.opacity = "0";
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textarea);
                }

                const img = btn?.querySelector('img');
                if (img) {
                    const originalSrc = img.src;
                    img.src = "./link.svg";
                    setTimeout(() => {
                        img.src = originalSrc;
                    }, 1000);
                }
            } catch (err) {
                console.error('Clipboard copy fallback failed:', err);
            }
        }

        document.body.addEventListener('click', async (e) => {
            const btn = e.target.closest('.share-btn, .copy-btn');
            if (!btn) return;

            e.preventDefault();
            e.stopPropagation();

            const route = btn.dataset.route;
            const id = btn.dataset.id;
            if (!route || !id) return;

            let plainTextTitle = btn.dataset.title || "";
            let shareText = "";

            if (route === "talk") {
                const talkData = (talkIndex || {})[id];
                plainTextTitle = plainTextTitle || talkData?.title || "";
                const rawAbstract = talkData?.abstract || btn.dataset.abstract || "";
                const plainAbstract = convertAbstractToPlainText(rawAbstract);

                if (plainTextTitle && plainAbstract) {
                    shareText = `${plainTextTitle}\n\n${plainAbstract}`;
                } else {
                    shareText = plainTextTitle || plainAbstract;
                }
            } else if (route === "author") {
                if (!plainTextTitle) {
                    const author = (authorIndex || {})[id];
                    plainTextTitle = author ? `${author.first_name || ''} ${author.last_name || ''}`.trim() : "";
                }
                shareText = plainTextTitle;
            } else {
                shareText = plainTextTitle;
            }

            const shareUrl = `${window.location.origin}${window.location.pathname}#/${route}/${id}`;
            const fullSharePayloadText = shareText ? `${shareText}\n\n${shareUrl}` : shareUrl;

            const shareData = {
                title: plainTextTitle || "HBES 2027",
                text: shareText
            };

            try {
                const parsedUrl = new URL(shareUrl, window.location.href);
                if (parsedUrl.protocol === 'http:' || parsedUrl.protocol === 'https:') {
                    shareData.url = parsedUrl.href;
                } else {
                    shareData.text = fullSharePayloadText;
                }
            } catch (err) {
                shareData.text = fullSharePayloadText;
            }

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    if (err.name !== "AbortError") {
                        console.error('Web Share failed, attempting clipboard fallback:', err);
                        await copyToClipboardFallback(fullSharePayloadText, btn);
                    }
                }
            } else {
                await copyToClipboardFallback(fullSharePayloadText, btn);
            }
        });
    </script>
</body>
