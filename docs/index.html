                                                data-datetime="2027-05-12 09:00:00-07:00"
                                                data-abstract="&lt;p class = &#34;title&#34;&gt;&lt;strong&gt;Depression is not a disoder&lt;/strong&gt;&lt;/p&gt;
    &lt;div class=&#34;authors-block&#34;&gt;
  &lt;p class=&#34;authors&#34;&gt;Edward Hagen&lt;sup&gt;1&lt;/sup&gt;, Michael Gaffney&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;
&lt;ol class=&#34;affiliations&#34;&gt;
  &lt;li&gt;Washington State University&lt;/li&gt;
  &lt;li&gt;UCLA&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
    &lt;div class = &#34;abstract&#34; style = &#34;margin-top: 10px;&#34;&gt;
    &lt;p&gt;Major &lt;strong&gt;depression&lt;/strong&gt; is considered to be a pathological response to stress that elicits aversive responses towards depressed individuals. Alternatively, depression might involve honest signals of need in response to stress and help to bargain for increased support from reluctant others. To test this hypothesis, we examined responses to a wide range of emotional signals in a vignette study in which we also manipulated information about the signaler’s need and her levels of conflict with the social partner (participant) in a between-subjects factorial design. Specifically, a fictional sister asked the participant to help pay for medical treatment. The sister’s true need for money was either clear or questionable, and her level of conflict with the participant was either high or low. The sister’s signals were either verbal request, crying, depression, or, as a control, schizophrenic symptoms.&lt;/p&gt;
&lt;p&gt;In our sample of 1,447 participants recruited from Amazon Mechanical Turk, depression increased belief in need and elicited more help than all the other proposed signals of need on our four outcome measures across all conditions. Simple crying and verbal requests were generally less effective. We also found evidence for the predicted interaction between signal type and conflict on relationship outcomes. Because signals comprising symptoms of schizophrenia caused a dramatic reduction in support, we can discount the hypothesis that help was provided due to symptoms of mental illness. Our results suggest that depression, an apparent human universal, is a relatively successful way of signaling honest need and eliciting support, consistent with costly signaling explanations.&lt;/p&gt;
    &lt;/div&gt;

                                                data-time="01:00 PM. " data-title="Objective and subjective measures of stress in Latinx immigrants before and after the 2016 presidential election: hair cortisol, epigenetics, and mental health"
                                                data-meta="Wed, 01:00 PM. VMMC"
                                                data-id="4" data-location="VMMC"
                                                data-datetime="2027-05-12 13:00:00-07:00"
                                                data-abstract="&lt;p class = &#34;title&#34;&gt;&lt;strong&gt;Objective and subjective measures of stress in Latinx immigrants before and after the 2016 presidential election: hair cortisol, epigenetics, and mental health&lt;/strong&gt;&lt;/p&gt;
    &lt;div class=&#34;authors-block&#34;&gt;
  &lt;p class=&#34;authors&#34;&gt;Elizabeth Clausing&lt;sup&gt;1&lt;/sup&gt;, Kimberly D&#39;Anna-Hernandez&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;
&lt;ol class=&#34;affiliations&#34;&gt;
  &lt;li&gt;Department of Anthropology, University of California, San Diego&lt;/li&gt;
  &lt;li&gt;Department of Psychology, California State University, San Marcos&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
    &lt;div class = &#34;abstract&#34; style = &#34;margin-top: 10px;&#34;&gt;
    &lt;p&gt;Immigrants have faced high burdens of stress since long before the current administration’s anti-immigrant policies. This study is an investigation of how immigration-related stress may impact the biology and health of Latinx immigrant mothers and children, considering recent increases in divisive rhetoric and anti-immigrant policies in the U.S. We compared hair cortisol and DNA methylation at stress-related candidate genes in mothers and children with interview data in Nashville, TN from two time points spanning the recent presidential election. Structured interviews were conducted with 82 immigrant mothers and their children (aged 5-13) between 2015 and 2016 and again in 2018. Using mixed-methods, we analyze perceived stressors, mental health, and buffering factors from mothers and children in relation to hair cortisol and bisulfite pyrosequencing at two stress-related genes. Mothers report high levels of depressive symptoms (24.3%), anxiety symptoms (35.1%), and moderate perceived stress (86.5%) as well as significantly decreased levels of optimism over time (mean difference = -3.4; p-value&amp;lt;0.001). Before the 2016 election, we find (log) children’s hair cortisol negatively associated with mother’s year’s in US (β = -0.07; p-value=0.04), and children’s worry over parent’s deportation (β = -0.31; p-value=0.069), suggesting a blunting effect on stress response. We see similar results following the election. We also see longitudinal epigenetic changes in FKBP5 (ρ = 0.42; p-value=0.05) in the mothers but no changes in the children. Increased stress over time can lead to biological and health consequences across the lifespan, especially for these already vulnerable families.&lt;/p&gt;
&lt;p&gt;Funds provided by the Chancellors Research in Excellence Scholars at UCSD (Application # 4-G021) and Foundation for Child Development (VU-14).&lt;/p&gt;
    &lt;/div&gt;

                                                data-meta="Thu, 08:00 AM. "

                                                data-datetime="2027-05-13 08:00:00-07:00"
                                                data-abstract="&lt;p class = &#34;title&#34;&gt;&lt;strong&gt;Ethnicity, fertility, and tobacco use: a biocultural test of the fetal protection model of female smoking&lt;/strong&gt;&lt;/p&gt;
    &lt;div class=&#34;authors-block&#34;&gt;
  &lt;p class=&#34;authors&#34;&gt;Tiffany Alvarez&lt;sup&gt;1&lt;/sup&gt;, Edward Hagen&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;
&lt;ol class=&#34;affiliations&#34;&gt;
  &lt;li&gt;UC Santa Barbara&lt;/li&gt;
  &lt;li&gt;Washington State University&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
    &lt;div class = &#34;abstract&#34; style = &#34;margin-top: 10px;&#34;&gt;
    &lt;p&gt;Currently, cross-country variation in gender equality is thought to be the primary factor producing global tobacco use sex differences, with gender inequality, especially in low-to-middle-income countries, preventing women from obtaining and using tobacco. Our alternative hypothesis draws on the “fetal protection” theory from evolutionary anthropology which emphasizes that reproductively-aged women protect their fetuses and nursing infants via an evolved a network of toxin defenses, characterized by upregulated detoxification of- and/or strong aversions to- teratogenic substances (e.g. tobacco)—individual-level defenses that are furthermore reinforced by culture-level proscriptions aimed at safeguarding fetal/offspring health. Although support for the fetal protection model has been found (Hagen et al. 2016), prior research has used data aggregated at the nation-level and has neither examined individual-level variation nor considered that cultural norms may also influence tobacco use. Using individual-level data from a high fertility, tobacco-growing, ethnically and socioeconomically diverse province in the South Central Andes (Jujuy, Argentina), we explore the relationship various fertility indices and sociocultural tobacco norms have on nulliparous and multiparous women’s tobacco use outcomes (N=108), while controlling for demographic features and considering ethnic differences as main effects. Smoker status was determined via salivary cotinine and cross-validated with questionnaire data. Our analyses reveal ethnic differences in tobacco use attitudes and behaviors and suggest fertility characteristics are important factors in female smoking decisions. Consistent with fetal protection model predictions, these findings suggest smoking vulnerabilities intersect with sex and socio-cultural variables in an additive manner and open the door to future areas of research.&lt;/p&gt;
    &lt;/div&gt;

                                        <div class="d-flex align-items-center mb-2">
                                            <button type="button" class="btn btn-light text-start pseudo-btn"
                                                data-bs-toggle="modal" data-bs-target="#globalTalkModal"
                                                data-time="01:00 PM. " data-title="Sexual division of labor in a Celtic population from Northern Italy: patterns of entheseal changes and long bone shape and robusticity from Seminario Vescovile"
                                                data-meta="Thu, 01:00 PM. "
                                                data-id="3" data-location=""
                                                data-datetime="2027-05-13 13:00:00-07:00"
                                                data-abstract="&lt;p class = &#34;title&#34;&gt;&lt;strong&gt;Sexual division of labor in a Celtic population from Northern Italy: patterns of entheseal changes and long bone shape and robusticity from Seminario Vescovile&lt;/strong&gt;&lt;/p&gt;
    &lt;div class=&#34;authors-block&#34;&gt;
  &lt;p class=&#34;authors&#34;&gt;Drosia Charisi&lt;sup&gt;1&lt;/sup&gt;, Zita Laffranchi&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;
&lt;ol class=&#34;affiliations&#34;&gt;
  &lt;li&gt;&lt;/li&gt;
  &lt;li&gt;Department of Legal Medicine, Toxicology and Physical Anthropology, Medicine Faculty, University of Granada (Spain)&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
    &lt;div class = &#34;abstract&#34; style = &#34;margin-top: 10px;&#34;&gt;
    &lt;p&gt;The presence of a sexual division of labor has been the focus of bioarchaeological research in a broad range of prehistoric contexts. Nonetheless, few data are available about the presence and type of gendered activities among Celtic populations. This gap hampers the analysis of the social nuances characterizing these populations and a broader understanding of the socioeconomic patterns featuring Iron Age communities of Western Europe. Here, we address these issues by testing the presence of gendered activities in a Celtic population (Cenomani Gauls) from Seminario Vescovile (Verona, NE Italy, 3rd-1st c. BC).&lt;/p&gt;
&lt;p&gt;Entheseal changes at 9 postcranial attachment sites, as well as humeral and femoral shape and robusticity indices calculated from external long bone measurements are compared between sexes in a sample of 56 adult individuals (N females=22; N males =34). The effect of sex, age, and side on the considered variables are tested by means of generalized linear models, generalized estimating equations, and Mann-Whitney tests.&lt;/p&gt;
&lt;p&gt;Analyses show a lack of difference between sexes in long bone shape, a higher incidence of upper and, especially, lower limb entheseal changes in males, and higher long bone robusticity in females.&lt;/p&gt;
&lt;p&gt;These results suggest the presence at SV of sex-specific activities mostly related to farming and differently influencing the considered variables. At the same time, this study underlines the need to consider non-functional factors (e.g. nutritional and developmental) when trying to infer patterns of physical activity from osteological variables.&lt;/p&gt;
    &lt;/div&gt;
    ">

    <script>
        // Platform detection and share icon setup
        const isAppleDevice = /Mac|iPhone|iPad|iPod/.test(navigator.userAgent);
        const shareIconSrc = isAppleDevice ? "./box-arrow-up.svg" : "./share.svg";

        // Global State & Pre-serialized JSON setup
        let favorites = JSON.parse(localStorage.getItem("conference_favorites") || "{}") || {};
        let talkIndex = {"1": {"id": "1", "session_id": 30595, "title": "Depression is not a disoder", "primaryauthors": [{"first_name": "Edward", "last_name": "Hagen", "affiliation": "Washington State University", "person_id": 271751, "email": "edhagen@wsu.edu", "presentations": ["1", "2"]}], "coauthors": [{"first_name": "Michael", "last_name": "Gaffney", "affiliation": "UCLA", "person_id": 271816, "email": "michael.gaffney@wsu.edu", "presentations": ["1"]}], "abstract": "<p class = \"title\"><strong>Depression is not a disoder</strong></p>\n    <div class=\"authors-block\">\n  <p class=\"authors\">Edward Hagen<sup>1</sup>, Michael Gaffney<sup>2</sup></p>\n<ol class=\"affiliations\">\n  <li>Washington State University</li>\n  <li>UCLA</li>\n</ol>\n</div>\n    <div class = \"abstract\" style = \"margin-top: 10px;\">\n    <p>Major <strong>depression</strong> is considered to be a pathological response to stress that elicits aversive responses towards depressed individuals. Alternatively, depression might involve honest signals of need in response to stress and help to bargain for increased support from reluctant others. To test this hypothesis, we examined responses to a wide range of emotional signals in a vignette study in which we also manipulated information about the signaler\u2019s need and her levels of conflict with the social partner (participant) in a between-subjects factorial design. Specifically, a fictional sister asked the participant to help pay for medical treatment. The sister\u2019s true need for money was either clear or questionable, and her level of conflict with the participant was either high or low. The sister\u2019s signals were either verbal request, crying, depression, or, as a control, schizophrenic symptoms.</p>\n<p>In our sample of 1,447 participants recruited from Amazon Mechanical Turk, depression increased belief in need and elicited more help than all the other proposed signals of need on our four outcome measures across all conditions. Simple crying and verbal requests were generally less effective. We also found evidence for the predicted interaction between signal type and conflict on relationship outcomes. Because signals comprising symptoms of schizophrenia caused a dramatic reduction in support, we can discount the hypothesis that help was provided due to symptoms of mental illness. Our results suggest that depression, an apparent human universal, is a relatively successful way of signaling honest need and eliciting support, consistent with costly signaling explanations.</p>\n    </div>\n    ", "location": "VMMC", "type": "Podium", "startdatetime": "2027-05-12 09:00:00-07:00", "start_time": "09:00 AM", "day": "Wed", "email": "edhagen@wsu.edu"}, "2": {"id": "2", "session_id": 30628, "title": "Ethnicity, fertility, and tobacco use: a biocultural test of the fetal protection model of female smoking", "primaryauthors": [{"first_name": "Tiffany", "last_name": "Alvarez", "affiliation": "UC Santa Barbara", "person_id": 272106, "email": "tiffany.alvarez@wsu.edu", "presentations": ["2"]}], "coauthors": [{"first_name": "Edward", "last_name": "Hagen", "affiliation": "Washington State University", "person_id": 271751, "email": "edhagen@wsu.edu"}], "abstract": "<p class = \"title\"><strong>Ethnicity, fertility, and tobacco use: a biocultural test of the fetal protection model of female smoking</strong></p>\n    <div class=\"authors-block\">\n  <p class=\"authors\">Tiffany Alvarez<sup>1</sup>, Edward Hagen<sup>2</sup></p>\n<ol class=\"affiliations\">\n  <li>UC Santa Barbara</li>\n  <li>Washington State University</li>\n</ol>\n</div>\n    <div class = \"abstract\" style = \"margin-top: 10px;\">\n    <p>Currently, cross-country variation in gender equality is thought to be the primary factor producing global tobacco use sex differences, with gender inequality, especially in low-to-middle-income countries, preventing women from obtaining and using tobacco. Our alternative hypothesis draws on the \u201cfetal protection\u201d theory from evolutionary anthropology which emphasizes that reproductively-aged women protect their fetuses and nursing infants via an evolved a network of toxin defenses, characterized by upregulated detoxification of- and/or strong aversions to- teratogenic substances (e.g. tobacco)\u2014individual-level defenses that are furthermore reinforced by culture-level proscriptions aimed at safeguarding fetal/offspring health. Although support for the fetal protection model has been found (Hagen et al. 2016), prior research has used data aggregated at the nation-level and has neither examined individual-level variation nor considered that cultural norms may also influence tobacco use. Using individual-level data from a high fertility, tobacco-growing, ethnically and socioeconomically diverse province in the South Central Andes (Jujuy, Argentina), we explore the relationship various fertility indices and sociocultural tobacco norms have on nulliparous and multiparous women\u2019s tobacco use outcomes (N=108), while controlling for demographic features and considering ethnic differences as main effects. Smoker status was determined via salivary cotinine and cross-validated with questionnaire data. Our analyses reveal ethnic differences in tobacco use attitudes and behaviors and suggest fertility characteristics are important factors in female smoking decisions. Consistent with fetal protection model predictions, these findings suggest smoking vulnerabilities intersect with sex and socio-cultural variables in an additive manner and open the door to future areas of research.</p>\n    </div>\n    ", "location": "", "type": "Podium", "startdatetime": "2027-05-13 08:00:00-07:00", "start_time": "08:00 AM", "day": "Thu", "email": "tiffany.alvarez@wsu.edu"}, "3": {"id": "3", "session_id": 30755, "title": "Sexual division of labor in a Celtic population from Northern Italy: patterns of entheseal changes and long bone shape and robusticity from Seminario Vescovile", "primaryauthors": [{"first_name": "Drosia", "last_name": "Charisi", "affiliation": "", "person_id": 272804, "email": "charisi@nowhere.com", "presentations": ["3"]}], "coauthors": [{"first_name": "Zita", "last_name": "Laffranchi", "affiliation": "Department of Legal Medicine, Toxicology and Physical Anthropology, Medicine Faculty, University of Granada (Spain)", "person_id": 272805, "email": "laffranchi@nowhere.com", "presentations": ["3"]}], "abstract": "<p class = \"title\"><strong>Sexual division of labor in a Celtic population from Northern Italy: patterns of entheseal changes and long bone shape and robusticity from Seminario Vescovile</strong></p>\n    <div class=\"authors-block\">\n  <p class=\"authors\">Drosia Charisi<sup>1</sup>, Zita Laffranchi<sup>2</sup></p>\n<ol class=\"affiliations\">\n  <li></li>\n  <li>Department of Legal Medicine, Toxicology and Physical Anthropology, Medicine Faculty, University of Granada (Spain)</li>\n</ol>\n</div>\n    <div class = \"abstract\" style = \"margin-top: 10px;\">\n    <p>The presence of a sexual division of labor has been the focus of bioarchaeological research in a broad range of prehistoric contexts. Nonetheless, few data are available about the presence and type of gendered activities among Celtic populations. This gap hampers the analysis of the social nuances characterizing these populations and a broader understanding of the socioeconomic patterns featuring Iron Age communities of Western Europe. Here, we address these issues by testing the presence of gendered activities in a Celtic population (Cenomani Gauls) from Seminario Vescovile (Verona, NE Italy, 3rd-1st c. BC).</p>\n<p>Entheseal changes at 9 postcranial attachment sites, as well as humeral and femoral shape and robusticity indices calculated from external long bone measurements are compared between sexes in a sample of 56 adult individuals (N females=22; N males =34). The effect of sex, age, and side on the considered variables are tested by means of generalized linear models, generalized estimating equations, and Mann-Whitney tests.</p>\n<p>Analyses show a lack of difference between sexes in long bone shape, a higher incidence of upper and, especially, lower limb entheseal changes in males, and higher long bone robusticity in females.</p>\n<p>These results suggest the presence at SV of sex-specific activities mostly related to farming and differently influencing the considered variables. At the same time, this study underlines the need to consider non-functional factors (e.g. nutritional and developmental) when trying to infer patterns of physical activity from osteological variables.</p>\n    </div>\n    ", "location": "", "type": "Podium", "startdatetime": "2027-05-13 13:00:00-07:00", "start_time": "01:00 PM", "day": "Thu", "email": "charisi@nowhere.com"}, "4": {"id": "4", "session_id": 30754, "title": "Objective and subjective measures of stress in Latinx immigrants before and after the 2016 presidential election: hair cortisol, epigenetics, and mental health", "primaryauthors": [{"first_name": "Elizabeth", "last_name": "Clausing", "affiliation": "Department of Anthropology, University of California, San Diego", "person_id": 272806, "email": "clausing@nowhere.com", "presentations": ["4"]}], "coauthors": [{"first_name": "Kimberly", "last_name": "D'Anna-Hernandez", "affiliation": "Department of Psychology, California State University, San Marcos", "person_id": 272807, "email": "hernandez@nowhere.com", "presentations": ["4"]}], "abstract": "<p class = \"title\"><strong>Objective and subjective measures of stress in Latinx immigrants before and after the 2016 presidential election: hair cortisol, epigenetics, and mental health</strong></p>\n    <div class=\"authors-block\">\n  <p class=\"authors\">Elizabeth Clausing<sup>1</sup>, Kimberly D'Anna-Hernandez<sup>2</sup></p>\n<ol class=\"affiliations\">\n  <li>Department of Anthropology, University of California, San Diego</li>\n  <li>Department of Psychology, California State University, San Marcos</li>\n</ol>\n</div>\n    <div class = \"abstract\" style = \"margin-top: 10px;\">\n    <p>Immigrants have faced high burdens of stress since long before the current administration\u2019s anti-immigrant policies. This study is an investigation of how immigration-related stress may impact the biology and health of Latinx immigrant mothers and children, considering recent increases in divisive rhetoric and anti-immigrant policies in the U.S. We compared hair cortisol and DNA methylation at stress-related candidate genes in mothers and children with interview data in Nashville, TN from two time points spanning the recent presidential election. Structured interviews were conducted with 82 immigrant mothers and their children (aged 5-13) between 2015 and 2016 and again in 2018. Using mixed-methods, we analyze perceived stressors, mental health, and buffering factors from mothers and children in relation to hair cortisol and bisulfite pyrosequencing at two stress-related genes. Mothers report high levels of depressive symptoms (24.3%), anxiety symptoms (35.1%), and moderate perceived stress (86.5%) as well as significantly decreased levels of optimism over time (mean difference = -3.4; p-value&lt;0.001). Before the 2016 election, we find (log) children\u2019s hair cortisol negatively associated with mother\u2019s year\u2019s in US (\u03b2 = -0.07; p-value=0.04), and children\u2019s worry over parent\u2019s deportation (\u03b2 = -0.31; p-value=0.069), suggesting a blunting effect on stress response. We see similar results following the election. We also see longitudinal epigenetic changes in FKBP5 (\u03c1 = 0.42; p-value=0.05) in the mothers but no changes in the children. Increased stress over time can lead to biological and health consequences across the lifespan, especially for these already vulnerable families.</p>\n<p>Funds provided by the Chancellors Research in Excellence Scholars at UCSD (Application # 4-G021) and Foundation for Child Development (VU-14).</p>\n    </div>\n    ", "location": "VMMC", "type": "Podium", "startdatetime": "2027-05-12 13:00:00-07:00", "start_time": "01:00 PM", "day": "Wed", "email": "clausing@nowhere.com"}};

        function getTalkById(id) {
            if (!id || !talkIndex) return null;
            if (talkIndex[id]) return talkIndex[id];
            if (talkIndex[String(id)]) return talkIndex[String(id)];
            const values = Array.isArray(talkIndex) ? talkIndex : Object.values(talkIndex);
            return values.find(t => t && String(t.id) === String(id)) || null;

        function convertAbstractToPlainText(htmlString) {
            if (!htmlString) return "";
            const doc = new DOMParser().parseFromString(htmlString, 'text/html');
            doc.querySelectorAll('p, div, br').forEach((el) => {
                if (el.tagName.toLowerCase() === 'br') {
                    el.replaceWith('\n');
                } else {
                    el.appendChild(doc.createTextNode('\n'));
                }
            });
            return doc.body.textContent
                .split('\n')
                .map((line) => line.trim())
                .filter((line) => line.length > 0)
                .join('\n');
        }

        function renderFavoritesList() {
            const listContainer = document.getElementById("favorites-list");
            if (!listContainer) return;

            favorites = JSON.parse(localStorage.getItem("conference_favorites") || "{}") || {};
            const keys = Object.keys(favorites);

            if (keys.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-4 text-muted"><p class="mb-0">No favorites saved yet.</p><small>Tap the star icon on any talk or session to save it here.</small></div>';
                return;
            }

            let favItems = keys.map((key) => ({
                key: key,
                data: favorites[key] || {},
            }));

            favItems.sort((a, b) => {
                const timeA = a.data.time ? new Date(a.data.time).getTime() : 0;
                const timeB = b.data.time ? new Date(b.data.time).getTime() : 0;
                return timeA - timeB;
            });

            listContainer.innerHTML = "";

            favItems.forEach((item) => {
                const [type, id] = item.key.split(":");
                const data = item.data;
                const isFav = !!favorites[`${type}:${id}`];
                const starImg = isFav ? "./star-fill.svg" : "./star.svg";

                const cardElement = document.createElement("div");
                cardElement.className = "card rounded-0 mb-2 shadow-sm";

                let content = "";
                let formattedTime = "";

                if (data.time) {
                    const dateObj = new Date(data.time);
                    if (!isNaN(dateObj.getTime())) {
                        formattedTime =
                            dateObj.toLocaleDateString("en-US", {
                                weekday: "short",
                                month: "short",
                                day: "numeric",
                            }) +
                            " " +
                            dateObj.toLocaleTimeString("en-US", {
                                hour: "2-digit",
                                minute: "2-digit",
                            });
                    } else {
                        formattedTime = data.time;
                    }
                }

                let modalAttributes = type === "talk" ? `role="button" tabindex="0" data-bs-toggle="modal" data-bs-target="#globalTalkModal" data-id="${id}"` : "";

                content += `<div class="flex-grow-1 text-start" ${modalAttributes}>`;
                content += `  <h6 class="${type === "talk" ? "mb-1 text-primary fw-bold" : "mb-1 text-success fw-bold"}">${data.title || 'Untitled'}</h6>`;

                if (formattedTime) {
                    content += `  <p class="mb-0 small text-muted"><img src="./calendar.svg" alt="Calendar" style="width: 14px; margin-right: 4px;" /> ${formattedTime}</p>`;
                }
                if (data.location) {
                    content += `  <p class="mb-0 small text-muted"><img src="./geo-alt.svg" alt="Location" style="width: 14px; margin-right: 4px;" /> ${data.location}</p>`;
                }
                content += `</div>`;

                content += `<div>`;
                content += `  <button type="button" class="fav-btn btn btn-link p-0 ms-3"
                            data-type="${type}"
                            data-id="${id}"
                            data-time="${data.time || ""}"
                            data-location="${data.location || ""}"
                            data-title="${(data.title || "").replace(/"/g, '&quot;')}"
                            title="Favorite">
                            <img src="${starImg}" alt="Favorite" />
                          </button>`;
                content += `</div>`;

                const cardBody = document.createElement("div");
                cardBody.className = "card-body d-flex justify-content-between align-items-center p-3";

                cardBody.innerHTML = content;
                cardElement.appendChild(cardBody);
                listContainer.appendChild(cardElement);
            });
        }

                if (!btn) return;

                const id = btn.dataset.id;
                const type = btn.dataset.type;
                if (!id || !type) return;

                const key = `${type}:${id}`;
                const talkData = getTalkById(id);

                let labelText = btn.dataset.title;
                if (!labelText && type === "talk" && talkData) {
                    labelText = talkData.title;
                }
                if (!labelText) {
                    const parent = btn.closest(".accordion-header, .d-flex, .modal-content");
                    if (parent) {
                        const titleEl = parent.querySelector(".fw-bold, button.pseudo-btn, h6, strong");
                        if (titleEl) labelText = titleEl.innerText.trim();
                    }
                }
                if (!labelText) labelText = "Untitled Item";

                labelText = labelText.split("\n")[0];

                if (favorites[key]) {
                    delete favorites[key];
                } else {
                    favorites[key] = {
                        title: labelText,
                        time: btn.dataset.time || (talkData ? talkData.startdatetime : ""),
                        location: btn.dataset.location || (talkData ? talkData.location : ""),
                        timestamp: new Date().toISOString(),
                    };
                }

                localStorage.setItem("conference_favorites", JSON.stringify(favorites));
                updateFavoriteIcons(type, id);

                e.preventDefault();
                showMapView();
            });

            document.getElementById("btn-export-favorites")?.addEventListener("click", async () => {
                const storedFavs = JSON.parse(localStorage.getItem("conference_favorites") || "{}") || {};
                const keys = Object.keys(storedFavs);
                const talkKeys = keys.filter((key) => key.startsWith("talk:"));

                if (talkKeys.length === 0) {
                    alert("You don't have any favorited talks to export yet!");
                    return;
                }

                let compiledTalks = talkKeys.map((key) => {
                    const [_, id] = key.split(":");
                    const talkData = getTalkById(id);
                    const favItem = storedFavs[key] || {};

                    const rawAbstract = talkData ? (talkData.abstract || talkData.description || talkData.content) : "";

                    return {
                        time: talkData ? talkData.startdatetime : favItem.time || "",
                        metaTime: talkData ? `${talkData.day || ''}, ${talkData.start_time || ''}` : "",
                        location: talkData ? talkData.location : favItem.location || "",
                        formattedContent: rawAbstract
                            ? convertAbstractToPlainText(rawAbstract)
                            : `📌 ${favItem.title || 'Talk'}`
                    };
                });

                compiledTalks.sort((a, b) => new Date(a.time) - new Date(b.time));

                let exportText = "HBES 2027 - My Saved Talks & Abstracts\n";
                exportText += "========================================\n\n";

                compiledTalks.forEach((talk) => {
                    exportText += talk.formattedContent + "\n";
                    if (talk.metaTime) exportText += `⏰ SCHEDULED TIME: ${talk.metaTime}\n`;
                    if (talk.location) exportText += `📍 LOCATION: ${talk.location}\n`;
                    exportText += "\n----------------------------------------\n\n";
                });

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: "My HBES 2027 Presentation Abstracts",
                            text: exportText
                        });
                    } catch (err) {
                        if (err.name !== "AbortError") {
                            console.error("Native OS web share pipeline failed:", err);
                        }
                    }
                } else {
                    await copyToClipboardFallback(exportText, document.getElementById("btn-export-favorites"));
                }
            });
        });

            const sortedAuthors = Object.values(authorIndex || {})

                        ? `${author.first_name || ''} ${author.last_name || ''}`.trim()
                        : (author.name || author.full_name || '').trim();
                    return fullName.length > 0;
                })
                .sort((a, b) => {
                    const lastNameCompare = (a?.last_name || a?.name || "").localeCompare(b?.last_name || b?.name || "");
                    if (lastNameCompare !== 0) return lastNameCompare;
                    return (a?.first_name || "").localeCompare(b?.first_name || "");

                        results = Object.values(authorIndex || {}).filter((author) => {
                            if (!author) return false;
                            const fullName = `${author.first_name || author.name || ''} ${author.last_name || ''}`.toLowerCase();
                            const affiliation = (author.affiliation || "").toLowerCase();
                            return fullName.includes(query) || affiliation.includes(query);
                        });
                    } else {
                        results = Object.values(talkIndex || {}).filter((talk) =>
                            talk && (
                                (talk.title && talk.title.toLowerCase().includes(query)) ||
                                (talk.abstract && talk.abstract.toLowerCase().includes(query)) ||
                                (talk.id && talk.id.toString().toLowerCase().includes(query))
                            )
                        );
                    }

                    results.forEach((item) => {
                        const resultItem = document.createElement("button");
                        resultItem.className = "list-group-item list-group-item-action d-flex justify-content-between align-items-center";

                        resultItem.dataset.targetId = item.person_id || item.id;
                        resultItem.dataset.isAuthor = isAuthorsView ? "true" : "false";

                        if (isAuthorsView) {
                            const name = `${item.first_name || item.name || ''} ${item.last_name || ''}`.trim();
                            resultItem.innerHTML = `<span class="text-start">${name}</span>`;
                        } else {
                            resultItem.innerHTML = `<span class="text-start">${item.day || ''} ${item.start_time || ''}: ${item.title || ''}</span>`;
                        }
                        searchResults.appendChild(resultItem);
                    });
                });

                searchResults.addEventListener("click", (e) => {
                    const btn = e.target.closest("button");
                    if (!btn || !searchResults.contains(btn)) return;

                    const targetId = btn.dataset.targetId;
                    const isAuthor = btn.dataset.isAuthor === "true";

                    if (isAuthor) {
                        const element = document.getElementById(`collapse${targetId}`);
                        if (element) {
                            bootstrap.Collapse.getOrCreateInstance(element, { toggle: false }).show();
                            setTimeout(() => {
                                element.closest('.accordion-item')?.scrollIntoView({ behavior: "smooth", block: "start" });
                            }, 300);
                        }
                    } else {
                        const originalBtn = document.querySelector(`button[data-id="${targetId}"][data-bs-target="#globalTalkModal"]`);
                        const modalInstance = bootstrap.Modal.getOrCreateInstance(globalModal);

                        if (originalBtn) {
                            modalInstance.show(originalBtn);
                        } else {
                            globalModal.dataset.activeTalkId = targetId;
                            modalInstance.show();
                        }
                    }
                });
            }

            document.getElementById("clear-search")?.addEventListener("click", () => {
                if (searchInput) {
                    searchInput.value = "";
                    searchInput.dispatchEvent(new Event("input"));
                }
                if (searchResults) {
                    searchResults.innerHTML = "";
                }
            });
        });

        // Sync Hash Routing
        function handleRouting() {
            const hash = window.location.hash;
            if (!hash) return;

            const parts = hash.split('/');
            if (parts.length < 3) return;

            const routeType = parts[1];
            const id = parts[2];

            if (routeType === 'talk') {
                const globalModal = document.getElementById('globalTalkModal');
                if (globalModal) {
                    const originalBtn = document.querySelector(`button[data-id="${id}"][data-bs-target="#globalTalkModal"]`);
                    const modalInstance = bootstrap.Modal.getOrCreateInstance(globalModal);

                    if (originalBtn) {
                        modalInstance.show(originalBtn);
                    } else {
                        globalModal.dataset.activeTalkId = id;
                        modalInstance.show();
                    }
                }
            } else if (routeType === 'session') {
                showScheduleView();

                const element = document.querySelector(`.tab-content .tab-pane:not(#pills-authors) #collapse${id}`);
                if (element) {
                    // Activate parent nested tabs up the DOM tree
                    let current = element.parentElement;
                    while (current && !current.classList.contains('container-fluid')) {
                        if (current.classList.contains('tab-pane')) {
                            const tabTrigger = document.querySelector(`button[data-bs-target="#${current.id}"]`);
                            if (tabTrigger) bootstrap.Tab.getOrCreateInstance(tabTrigger).show();
                        }
                        current = current.parentElement;
                    }

                    bootstrap.Collapse.getOrCreateInstance(element).show();
                    setTimeout(() => {
                        element.closest('.accordion-item')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 300);
                }
            } else if (routeType === 'author') {
                showAuthorsView();

                const element = document.querySelector(`#accordion-authors #collapse${id}`);
                if (element) {
                    bootstrap.Collapse.getOrCreateInstance(element).show();
                    setTimeout(() => {
                        element.closest('.accordion-item')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 300);
                }
            }
        }

        window.addEventListener('hashchange', handleRouting);
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(handleRouting, 100);
        });

        document.body.addEventListener('show.bs.collapse', function (event) {
            const collapseEl = event.target;
            if (!collapseEl.id || !collapseEl.id.startsWith('collapse')) return;

            const id = collapseEl.id.replace('collapse', '');

            if (collapseEl.closest('#accordion-authors')) {
                if (window.location.hash !== `#/author/${id}`) window.location.hash = `#/author/${id}`;
            } else {
                if (window.location.hash !== `#/session/${id}`) window.location.hash = `#/session/${id}`;
            }
        });

        document.body.addEventListener('hide.bs.collapse', function (event) {
            const collapseEl = event.target;
            if (!collapseEl.id || !collapseEl.id.startsWith('collapse')) return;

            const id = collapseEl.id.replace('collapse', '');
            if (window.location.hash === `#/session/${id}` || window.location.hash === `#/author/${id}`) {
                window.location.hash = '';
            }
        });

        // QR Scanner Handlers
        let html5QrScanner = null;

        document.getElementById('btn-scan-qr')?.addEventListener('click', () => {
            const qrModalEl = document.getElementById('qrScannerModal');
            if (qrModalEl) {
                const scannerModal = new bootstrap.Modal(qrModalEl);
                scannerModal.show();
            }
        });

        document.getElementById('qrScannerModal')?.addEventListener('shown.bs.modal', () => {
            html5QrScanner = new Html5Qrcode("qr-video-reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrScanner.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    try {
                        const url = decodedText.includes('#') ? new URL(decodedText) : null;
                        const hashValue = url ? url.hash : decodedText;

                        if (hashValue && hashValue.startsWith('#/')) {
                            html5QrScanner.stop().then(() => {
                                const qrModalEl = document.getElementById('qrScannerModal');
                                if (qrModalEl) bootstrap.Modal.getInstance(qrModalEl)?.hide();
                                window.location.hash = hashValue;
                            });
                        }
                    } catch (err) {
                        console.error("Malformed QR data payload parsed.", err);
                    }
                },
                () => { }
            ).catch(err => console.error("Camera access failed or rejected by system settings.", err));
        });

        document.getElementById('qrScannerModal')?.addEventListener('hide.bs.modal', () => {
            if (html5QrScanner && html5QrScanner.isScanning) {
                html5QrScanner.stop().catch(err => console.error("Error killing video track context.", err));
            }
        });

        async function copyToClipboardFallback(textToCopy, btn) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(textToCopy);
                } else {
                    const textarea = document.createElement("textarea");
                    textarea.value = textToCopy;
                    textarea.style.position = "fixed";
                    textarea.style.opacity = "0";
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textarea);
                }

                const img = btn?.querySelector('img');
                if (img) {
                    const originalSrc = img.src;
                    img.src = "./link.svg";
                    setTimeout(() => {
                        img.src = originalSrc;
                    }, 1000);
                }
            } catch (err) {
                console.error('Clipboard copy fallback failed:', err);
            }
        }

        document.body.addEventListener('click', async (e) => {
            const btn = e.target.closest('.share-btn, .copy-btn');
            if (!btn) return;

            e.preventDefault();
            e.stopPropagation();

            const route = btn.dataset.route;
            const id = btn.dataset.id;
            if (!route || !id) return;

            let plainTextTitle = btn.dataset.title || "";
            let shareText = "";

            if (route === "talk") {
                const talkData = getTalkById(id);
                plainTextTitle = plainTextTitle || talkData?.title || "";
                const rawAbstract = (talkData && (talkData.abstract || talkData.description || talkData.content)) || btn.dataset.abstract || "";
                const plainAbstract = convertAbstractToPlainText(rawAbstract);

                if (plainTextTitle && plainAbstract) {
                    shareText = `${plainTextTitle}\n\n${plainAbstract}`;
                } else {
                    shareText = plainTextTitle || plainAbstract;
                }
            } else if (route === "author") {
                if (!plainTextTitle) {
                    const author = (authorIndex || {})[id] || Object.values(authorIndex || {}).find(a => String(a?.person_id || a?.id) === String(id));
                    plainTextTitle = author ? `${author.first_name || author.name || ''} ${author.last_name || ''}`.trim() : "";
                }
                shareText = plainTextTitle;
            } else {
                shareText = plainTextTitle;
            }

            const shareUrl = `${window.location.origin}${window.location.pathname}#/${route}/${id}`;
            const fullSharePayloadText = shareText ? `${shareText}\n\n${shareUrl}` : shareUrl;

            const shareData = {
                title: plainTextTitle || "HBES 2027",
                text: shareText
            };

            try {
                const parsedUrl = new URL(shareUrl, window.location.href);
                if (parsedUrl.protocol === 'http:' || parsedUrl.protocol === 'https:') {
                    shareData.url = parsedUrl.href;
                } else {
                    shareData.text = fullSharePayloadText;
                }
            } catch (err) {
                shareData.text = fullSharePayloadText;
            }

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    if (err.name !== "AbortError") {
                        console.error('Web Share failed, attempting clipboard fallback:', err);
                        await copyToClipboardFallback(fullSharePayloadText, btn);
                    }
                }
            } else {
                await copyToClipboardFallback(fullSharePayloadText, btn);
            }
        });
    </script>
